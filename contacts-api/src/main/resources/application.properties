# Nome da aplicação
spring.application.name=contacts-api

# CONFIGURAÇÃO DO BANCO (H2 em ARQUIVO para não apagar no Rerun)
# Mudamos de 'mem' para 'file' e salvamos na pasta do projeto
spring.datasource.url=jdbc:h2:file:./data/contacts_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HIBERNATE / JPA
# 'update' para manter os dados existentes e apenas atualizar a estrutura
spring.jpa.hibernate.ddl-auto=update
# Mostra o SQL no console (útil para ver o que o PUT está a fazer)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CONSOLE H2
# Para acederes em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# IMPORTANTE: Garante que o Hibernate não tente criar tudo do zero se o ficheiro já existir
spring.jpa.defer-datasource-initialization=true