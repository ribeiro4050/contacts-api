# Garante que o Hibernate nao tente criar tudo do zero
spring.jpa.defer-datasource-initialization=true

spring.application.name=contacts-api

# CONFIGURACAO DO MYSQL
# Altere 'localhost:3306' se o seu MySQL estiver em outra porta ou host
# O final '/contacts_db' e o nome do banco que voce deve criar no MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/contacts_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# HIBERNATE / JPA
# 'update' cria as tabelas automaticamente se elas nao existirem
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect